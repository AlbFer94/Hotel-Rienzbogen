<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <!-- Symbol / Emblem -->
  <g transform="translate(15, 10)">
    <!-- Elegant circle frame background hint -->
    <circle cx="45" cy="45" r="42" stroke="#81542e" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
    
    <!-- Alpine Mountain Peaks (Valdaora / Dolomiti) -->
    <!-- Background peak (soft) -->
    <polygon points="45,18 64,56 26,56" fill="#2f4a3a" opacity="0.35" />
    <!-- Main peak (sharp, deep forest green #193325) -->
    <polygon points="35,26 55,62 15,62" fill="#193325" />
    <!-- Snow cap / negative space contour -->
    <polygon points="35,26 40,36 37,38 32,38 30,36" fill="#f7f3ec" />
    <polygon points="45,18 51,30 47,32 42,32 40,30" fill="#f7f3ec" opacity="0.8" />

    <!-- "Bogen" / River Rienza Arch (dynamic, embracing curve in warm cirmolo #81542e) -->
    <path d="M12,68 C28,52 62,52 78,68 C68,76 38,78 22,74" fill="#81542e" />
    
    <!-- Water / River ripple line -->
    <path d="M20,77 C35,74 55,74 70,77" stroke="#193325" stroke-width="2" stroke-linecap="round" />
    
    <!-- Pine cone / Cirmolo needle delicate accent -->
    <circle cx="45" cy="14" r="2.5" fill="#81542e" />
  </g>

  <!-- Typography -->
  <!-- Hotel Name -->
  <text x="125" y="52" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.12em" fill="#193325">
    RIENZBOGEN
  </text>
  
  <!-- Hotel Category / Subtitle -->
  <text x="126" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.28em" fill="#81542e">
    HOTEL · VALDAORA · DOLOMITI
  </text>

  <!-- Subtle divider accent -->
  <line x1="126" y1="83" x2="330" y2="83" stroke="#c2c8c1" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />
</svg>