<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Sfondo rotondo opzionale o trasparente -->
  <!-- Arch (Bogen) in legno di cirmolo #81542e -->
  <path d="M 22,82 L 22,46 A 28,28 0 0,1 78,46 L 78,82" stroke="#81542e" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Cime montuose alpine in verde bosco #193325 -->
  <polyline points="28,52 46,32 62,48 72,38 80,50" stroke="#193325" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Curva del fiume Rienza (Rienz) -->
  <path d="M 22,80 C 45,80 40,68 60,65 C 72,63 76,65 78,66" stroke="#81542e" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Dettaglio ramo e pigna di cirmolo #193325 -->
  <path d="M 58,68 Q 68,64 78,74" stroke="#193325" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="75" cy="74" r="3" fill="#193325" />
</svg>